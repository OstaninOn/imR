<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇮🇹 Italy Radio JSON Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0d0a;
    --surface: #121612;
    --border: #1e2a1e;
    --accent: #009246;
    --accent2: #CE2B37;
    --gold: #f4c430;
    --text: #f0eeea;
    --muted: #888;
    --green: #7ecfc0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    padding: 2rem;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 0.25rem;
  }
  h1 span { color: var(--accent); }

  .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 2rem; }

  .flag-stripe { display: flex; height: 5px; margin-bottom: 1.5rem; width: 120px; }
  .flag-stripe div { flex: 1; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 1rem;
    margin-bottom: 1.5rem; align-items: center;
  }

  button {
    background: var(--accent); color: #fff; border: none;
    padding: 0.75rem 1.5rem; font-family: 'Space Mono', monospace;
    font-size: 0.8rem; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.15s;
  }
  button:hover { filter: brightness(1.15); transform: translateY(-1px); }
  button:disabled { background: var(--muted); color: #222; cursor: not-allowed; transform: none; filter: none; }

  .btn-secondary {
    background: transparent; border: 1px solid var(--border); color: var(--text);
  }
  .btn-secondary:hover { background: var(--surface); filter: none; }

  .status-bar {
    display: flex; align-items: center; gap: 1rem;
    padding: 1rem; background: var(--surface);
    border: 1px solid var(--border); margin-bottom: 1.5rem; font-size: 0.75rem;
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
  }
  .dot.loading { background: var(--gold); animation: pulse 1s infinite; }
  .dot.done { background: var(--accent); }
  .dot.error { background: var(--accent2); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .stats { display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .stat { text-align: center; }
  .stat-num {
    font-family: 'Syne', sans-serif; font-size: 2rem;
    font-weight: 800; color: var(--accent);
  }
  .stat-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }

  .output-wrap { position: relative; }

  textarea {
    width: 100%; height: 62vh; background: var(--surface);
    border: 1px solid var(--border); color: var(--green);
    font-family: 'Space Mono', monospace; font-size: 0.72rem;
    padding: 1rem; resize: vertical; outline: none; line-height: 1.5;
  }
  textarea:focus { border-color: var(--accent); }

  .copy-btn {
    position: absolute; top: 0.5rem; right: 0.5rem;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-size: 0.65rem; padding: 0.4rem 0.8rem;
  }

  .progress-bar { width: 100%; height: 3px; background: var(--border); margin-bottom: 1rem; display: none; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    width: 0%; transition: width 0.3s;
  }
</style>
</head>
<body>

<div class="flag-stripe">
  <div style="background:#009246"></div>
  <div style="background:#fff"></div>
  <div style="background:#CE2B37"></div>
</div>

<h1>🇮🇹 Italy Radio <span>JSON</span></h1>
<p class="sub">Все FM радиостанции Италии · Radio Browser API · Логотипы · Уникальные координаты</p>

<div class="controls">
  <button id="fetchBtn" onclick="fetchStations()">⬇ Загрузить станции</button>
  <button class="btn-secondary" id="downloadBtn" onclick="downloadJSON()" disabled>💾 Скачать JSON</button>
  <button class="btn-secondary" onclick="copyAll(event)">📋 Копировать</button>
</div>

<div class="progress-bar" id="progressBar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="status-bar">
  <div class="dot" id="statusDot"></div>
  <span id="statusText">Нажми «Загрузить станции» для начала</span>
</div>

<div class="stats" id="stats" style="display:none">
  <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">Станций</div></div>
  <div class="stat"><div class="stat-num" id="cityCount">0</div><div class="stat-label">Городов</div></div>
  <div class="stat"><div class="stat-num" id="dupCount">0</div><div class="stat-label">Дублей удалено</div></div>
  <div class="stat"><div class="stat-num" id="logoCount">0</div><div class="stat-label">С логотипом</div></div>
</div>

<div class="output-wrap">
  <textarea id="output" placeholder='// JSON появится здесь после загрузки...'></textarea>
  <button class="btn-secondary copy-btn" onclick="copyAll(event)">COPY</button>

function getLogo(name, url, favicon) {
  // 1. If API returned a real favicon (not empty, not generic)
  if (favicon && favicon.length > 10 && !favicon.includes('radiobrowser')) return favicon;

  for (const [key, logo] of Object.entries(knownLogos)) {
    if (nameLower.includes(key)) return logo;
  }

  // 3. Google favicon from stream URL domain
  if (url) return faviconURL(url);

  return '';
}

function getCoords(state, name) {
  const fields = [state, name].filter(Boolean);
  for (const field of fields) {
    for (const [city, coords] of Object.entries(cityCoords)) {
      if (city && field.toLowerCase().includes(city.toLowerCase())) {
        return { ...coords };
      }
    }
  }
  return {
    lat: 37.5 + Math.random() * 9,
    lon: 7.0 + Math.random() * 11
  };
}

async function fetchStations() {
  const btn = document.getElementById('fetchBtn');
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  btn.disabled = true;
  dot.className = 'dot loading';
  document.getElementById('progressBar').style.display = 'block';
  setProgress(10);
  statusText.textContent = 'Подключаемся к Radio Browser API...';

  try {
    setProgress(25);
    statusText.textContent = 'Загружаем FM станции Италии...';

    // Fetch with tag=FM for FM-only stations
    const [respFM, respAll] = await Promise.all([
      fetch('https://de1.api.radio-browser.info/json/stations/bycountryexact/Italy?limit=300&order=votes&reverse=true&hidebroken=true&tag=fm', { headers: { 'User-Agent': 'ItalyRadioGenerator/1.0' } }),
      fetch('https://de1.api.radio-browser.info/json/stations/bycountryexact/Italy?limit=300&order=votes&reverse=true&hidebroken=true', { headers: { 'User-Agent': 'ItalyRadioGenerator/1.0' } })
    ]);

    if (!respFM.ok || !respAll.ok) throw new Error('Ошибка API');
    const [fmStations, allStations] = await Promise.all([respFM.json(), respAll.json()]);

    setProgress(50);
    statusText.textContent = `Получено ${fmStations.length} FM + ${allStations.length} всего. Объединяем...`;

    // Merge: FM-tagged first, then all, deduplicate
    const seen = new Set();
    const merged = [];
    let dupCount = 0;

    for (const s of [...fmStations, ...allStations]) {
      const key = s.name.trim().toLowerCase().replace(/[^a-zа-яà-ú0-9]/gi, '');
      if (!seen.has(key)) {
        seen.add(key);
        merged.push(s);
      } else {
        dupCount++;
      }
    }

    setProgress(70);
    statusText.textContent = 'Назначаем координаты и логотипы...';

    const cityOffsets = {};
    let logoCount = 0;

    const result = merged.map(s => {
      const base = getCoords(s.state, s.name);
      const ck = `${Math.round(base.lat * 10)}_${Math.round(base.lon * 10)}`;
      if (!cityOffsets[ck]) cityOffsets[ck] = 0;
      cityOffsets[ck]++;
      const n = cityOffsets[ck];

      const angle = (n - 1) * 137.508 * (Math.PI / 180);
      const radius = 0.009 * Math.sqrt(n);
      const lat = parseFloat((base.lat + Math.cos(angle) * radius).toFixed(6));
      const lon = parseFloat((base.lon + Math.sin(angle) * radius).toFixed(6));

      const imageURL = getLogo(s.name, s.url_resolved || s.url, s.favicon);
      if (imageURL) logoCount++;

      return {
        name: s.name.trim(),
        coordinates: { lat, lon },
        radioStations: [{
          title: s.name.trim(),
          subtitle: s.state || 'Italy',
          logo: 'dot.radiowaves.left.and.right',
          imageURL,
          imageSize: 85,
          playerImageSize: 85,
          streamURL: s.url_resolved || s.url
        }]
      };
    });

    setProgress(100);
    finalJSON = result;
    document.getElementById('output').value = JSON.stringify(result, null, 2);

    const cities = new Set(merged.map(s => s.state || 'Italy'));
    document.getElementById('totalCount').textContent = result.length;
    document.getElementById('cityCount').textContent = cities.size;
    document.getElementById('dupCount').textContent = dupCount;
    document.getElementById('logoCount').textContent = logoCount;
    document.getElementById('stats').style.display = 'flex';

    dot.className = 'dot done';
    statusText.textContent = `✓ Готово! ${result.length} станций · ${cities.size} регионов · ${logoCount} с логотипом`;
    document.getElementById('downloadBtn').disabled = false;

  } catch (err) {
    dot.className = 'dot error';
    statusText.textContent = '✗ Ошибка: ' + err.message;
    document.getElementById('output').value = '// Ошибка: ' + err.message;
  }

  btn.disabled = false;
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

function downloadJSON() {
  if (!finalJSON) return;
  const blob = new Blob([JSON.stringify(finalJSON, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'italy_radio_stations.json';
  a.click();
}

function copyAll(e) {
  const ta = document.getElementById('output');
  ta.select();
  document.execCommand('copy');
  const btn = e.target;
  const orig = btn.textContent;
  btn.textContent = 'COPIED!';
  setTimeout(() => btn.textContent = orig, 1500);
}
</script>
</body>
</html>
